name: Rapport de bug
description: Signaler un comportement incorrect et reproductible
title: "fix: "
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Que se passe-t-il et quel comportement attendiez-vous ?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Étapes de reproduction
      placeholder: |
        1. Ouvrir…
        2. Cliquer sur…
        3. Observer…
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Navigateur et version
      placeholder: Firefox 128, Chrome 127…
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Appareil
      options:
        - Ordinateur
        - Mobile
        - Tablette
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Captures ou journaux
      description: Ajoutez uniquement des informations sans secret ni donnée personnelle.