name: ViaOps CI/CD Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

env:
  IMAGE_NAME: viaops
  DOCKER_HUB_USERNAME: lims4

jobs:

  # ── JOB 1 : Lint — Qualité du code ─────────────────────────
  lint:
    name: 🔍 Lint — ESLint · Stylelint · html-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Installer l'outillage (devDependencies)
        run: npm ci

      - name: Lint JS · CSS · HTML
        run: npm run lint

  # ── JOB 2 : Build Docker ───────────────────────────────────
  build:
    name: 🐳 Build — Image Docker
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build de l'image Docker
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: false
          tags: ${{ env.IMAGE_NAME }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de l'image buildée
        run: |
          docker build -t ${{ env.IMAGE_NAME }}:test .
          docker run -d --name viaops-test -p 8080:80 ${{ env.IMAGE_NAME }}:test
          sleep 5
          curl -f http://localhost:8080 && echo "✓ App accessible"
          docker stop viaops-test && docker rm viaops-test

      - name: Scan de sécurité de l'image (Trivy)
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_NAME }}:test
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: '1'

  # ── JOB 3 : Publish Docker Hub ─────────────────────────────
  publish:
    name: 📦 Publish — Docker Hub
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login Docker Hub
        uses: docker/login-action@v3
        with:
          username: lims4
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Extraire les métadonnées Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: lims4/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-

      - name: Build et Push sur Docker Hub
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ── JOB 4 : Deploy GitHub Pages ────────────────────────────
  deploy:
    name: 🚀 Deploy — GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    permissions:
      contents: write
      pages: write
      id-token: write

    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Préparer les fichiers pour GitHub Pages
        run: |
          mkdir -p ./dist
          cp index.html ./dist/
          cp nginx.conf ./dist/
          cp -r assets/ ./dist/assets/
          # Copier les modules si le dossier existe
          if [ -d "./modules" ]; then
            cp -r modules/ ./dist/modules/
          else
            mkdir -p ./dist/modules
          fi
          echo "=== Contenu dist/ ==="
          find ./dist -type f | sort

      - name: Deploy sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "deploy: ${{ github.sha }} — ${{ github.event.head_commit.message }}"
