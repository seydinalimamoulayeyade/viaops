name: ViaOps CI/CD Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: viaops-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE_NAME: viaops
  DOCKER_HUB_USERNAME: lims4

jobs:
  quality:
    name: 🔍 Qualité — lint et tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Vérifier Node.js
        run: node --version

      - name: Installer l'outillage
        run: npm ci

      - name: Lint JS · CSS · HTML
        run: npm run lint

      - name: Tests d'intégrité statique
        run: npm test

  build:
    name: 🐳 Build · smoke test · scan · publication
    runs-on: ubuntu-latest
    needs: quality
    permissions:
      contents: read
    steps:
      - name: Checkout du code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Construire l'image une seule fois
        run: docker build --tag "${IMAGE_NAME}:${GITHUB_SHA}" .

      - name: Smoke test de l'image et des headers
        shell: bash
        run: |
          set -euo pipefail
          docker run -d --name viaops-test -p 8080:8080 "${IMAGE_NAME}:${GITHUB_SHA}"
          trap 'docker rm -f viaops-test >/dev/null 2>&1 || true' EXIT
          for attempt in {1..15}; do
            curl --fail --silent http://localhost:8080/ >/dev/null && break
            test "$attempt" -lt 15 || exit 1
            sleep 1
          done
          curl --fail --silent http://localhost:8080/modules/docker.html >/dev/null
          curl --fail --silent http://localhost:8080/design-system.html >/dev/null
          curl --fail --silent --head http://localhost:8080/ | grep -qi '^Content-Security-Policy:'

      - name: Scanner l'image avec Trivy conteneurisé
        run: |
          docker run --rm \
            --volume /var/run/docker.sock:/var/run/docker.sock \
            aquasec/trivy@sha256:3d1f862cb6c4fe13c1506f96f816096030d8d5ccdb2380a3069f7bf07daa86aa \
            image --exit-code 1 --ignore-unfixed --severity HIGH,CRITICAL \
            "${IMAGE_NAME}:${GITHUB_SHA}"

      - name: Connexion à Docker Hub
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        env:
          DOCKER_HUB_TOKEN: ${{ secrets.DOCKER_HUB_TOKEN }}
        run: echo "$DOCKER_HUB_TOKEN" | docker login --username "$DOCKER_HUB_USERNAME" --password-stdin

      - name: Publier l'image testée et scannée
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        shell: bash
        run: |
          set -euo pipefail
          short_sha="${GITHUB_SHA::12}"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${DOCKER_HUB_USERNAME}/${IMAGE_NAME}:latest"
          docker tag "${IMAGE_NAME}:${GITHUB_SHA}" "${DOCKER_HUB_USERNAME}/${IMAGE_NAME}:sha-${short_sha}"
          docker push "${DOCKER_HUB_USERNAME}/${IMAGE_NAME}:latest"
          docker push "${DOCKER_HUB_USERNAME}/${IMAGE_NAME}:sha-${short_sha}"

  deploy:
    name: 🚀 Déploiement GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      contents: write
    steps:
      - name: Checkout du code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Préparer les fichiers statiques
        run: |
          mkdir -p dist
          cp index.html design-system.html dist/
          cp -r assets modules dist/

      - name: Déployer sur GitHub Pages
        uses: peaceiris/actions-gh-pages@v3.9.3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
          commit_message: "deploy: ${{ github.sha }}"
