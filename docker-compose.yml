# ============================================================
# ViaOps — environnement local de développement et de test
# ============================================================

services:
  viaops:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: viaops-app
    image: viaops:1.6.2
    ports:
      - "8080:8080"
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
      - /var/cache/nginx
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    security_opt:
      - no-new-privileges:true
    labels:
      - "project=viaops"
      - "env=local"
    networks:
      - viaops-net

networks:
  viaops-net:
    driver: bridge
