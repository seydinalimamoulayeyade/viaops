<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8" />
<title>ViaOps — carte sociale (1200×630)</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@500;600;700&family=JetBrains+Mono:wght@500&display=swap" rel="stylesheet" />
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { background: #1a1a1a; display: grid; place-items: center; min-height: 100vh; }

  /* Carte exacte 1200×630 — capturer CET element */
  .og {
    width: 1200px; height: 630px;
    background: #0E1B2B;
    background-image:
      linear-gradient(rgba(79,209,232,.06) 1px, transparent 1px),
      linear-gradient(90deg, rgba(79,209,232,.06) 1px, transparent 1px);
    background-size: 40px 40px;
    position: relative;
    padding: 64px 72px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
    font-family: 'Oswald', sans-serif;
    color: #EAF4F8;
  }
  /* halo */
  .og::after {
    content: ""; position: absolute; top: -200px; left: 50%; transform: translateX(-50%);
    width: 900px; height: 500px;
    background: radial-gradient(ellipse at center, rgba(79,209,232,.14), transparent 70%);
    pointer-events: none;
  }
  /* équerres de coin */
  .corner { position: absolute; width: 26px; height: 26px; border: 2px solid #4FD1E8; }
  .tl { top: 28px; left: 28px; border-right: none; border-bottom: none; }
  .tr { top: 28px; right: 28px; border-left: none; border-bottom: none; }
  .bl { bottom: 28px; left: 28px; border-right: none; border-top: none; }
  .br { bottom: 28px; right: 28px; border-left: none; border-top: none; }

  .top { display: flex; align-items: center; gap: 16px; position: relative; z-index: 1; }
  .mark { width: 52px; height: 52px; border: 2px solid #4FD1E8; border-radius: 8px; display: grid; place-items: center; }
  .mark svg { width: 30px; height: 30px; stroke: #4FD1E8; stroke-width: 2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
  .brand { font-size: 30px; font-weight: 700; letter-spacing: .04em; }
  .brand b { color: #4FD1E8; }
  .eyebrow { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 15px; color: #FF6B4A; letter-spacing: .12em; text-transform: uppercase; }

  .mid { position: relative; z-index: 1; }
  h1 { font-size: 72px; font-weight: 700; line-height: 1.04; text-transform: uppercase; letter-spacing: .01em; }
  h1 .cy { color: #4FD1E8; }
  .sub { margin-top: 20px; font-family: 'JetBrains Mono', monospace; font-size: 18px; color: #9DB4C4; letter-spacing: .02em; }

  .rail { display: flex; align-items: center; gap: 14px; position: relative; z-index: 1; }
  .tile { width: 60px; height: 60px; border: 1px solid rgba(79,209,232,.3); border-radius: 10px; background: #0B1622; display: grid; place-items: center; }
  .tile img { width: 32px; height: 32px; }
  .sep { color: #4FD1E8; font-family: 'JetBrains Mono', monospace; }
  .url { margin-left: auto; font-family: 'JetBrains Mono', monospace; font-size: 16px; color: #EAF4F8; }
</style>
</head>
<body>
  <div class="og">
    <span class="corner tl"></span><span class="corner tr"></span>
    <span class="corner bl"></span><span class="corner br"></span>

    <div class="top">
      <div class="mark"><svg viewBox="0 0 24 24"><path d="M12 2 2 7l10 5 10-5-10-5Z"/><path d="m2 17 10 5 10-5"/><path d="m2 12 10 5 10-5"/></svg></div>
      <span class="brand">VIA<b>OPS</b></span>
      <span class="eyebrow">// la voie devops</span>
    </div>

    <div class="mid">
      <h1>L'essentiel DevOps,<br /><span class="cy">câblé</span> comme un pipeline.</h1>
      <div class="sub">10 outils · quiz de validation · parcours « de zéro à la prod »</div>
    </div>

    <div class="rail">
      <div class="tile"><img src="assets/img/logos/docker.svg" alt="" /></div>
      <span class="sep">→</span>
      <div class="tile"><img src="assets/img/logos/jenkins.svg" alt="" /></div>
      <span class="sep">→</span>
      <div class="tile"><img src="assets/img/logos/sonarqube.svg" alt="" /></div>
      <span class="sep">→</span>
      <div class="tile"><img src="assets/img/logos/trivy.svg" alt="" /></div>
      <span class="sep">→</span>
      <div class="tile"><img src="assets/img/logos/terraform.svg" alt="" /></div>
      <span class="sep">→</span>
      <div class="tile"><img src="assets/img/logos/kubernetes.svg" alt="" /></div>
      <span class="sep">→</span>
      <div class="tile"><img src="assets/img/logos/argocd.svg" alt="" /></div>
      <span class="sep">→</span>
      <div class="tile"><img src="assets/img/logos/prometheus.svg" alt="" /></div>
      <span class="url">seydinalimamoulayeyade.github.io/viaops</span>
    </div>
  </div>
</body>
</html>
